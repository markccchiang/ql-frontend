# nginx for the container: the app and the guide on 8080, and /ws/ passed
# through to ql-backend on loopback. It runs as the unprivileged `ql` user, so
# everything it writes goes to /tmp and its logs go to the container's output.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        root /srv/ql-frontend;

        # The socket, and /ws/healthz, which is where the app's connection
        # diagnosis asks (it appends /healthz to the socket URL). The trailing
        # slash on proxy_pass strips the /ws prefix. The browser's Origin header
        # is passed on untouched: ql-backend's --allow-origin check is the one
        # that decides, not this proxy.
        location /ws/ {
            proxy_pass http://127.0.0.1:9111/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            # A session can sit idle between questions; the client reconnects
            # and resumes if this is ever reached.
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        # Vite fingerprints everything under assets/, so it can be cached for good.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /doc/ {
            try_files $uri $uri/ =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
