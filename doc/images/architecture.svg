<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1188 372" width="1188" height="372" role="img" aria-labelledby="title desc">
  <title id="title">How the three layers fit together</title>
  <desc id="desc">The browser holds the workbook and sends one binary ClientFrame per request over a WebSocket. The service holds the session, a live QuantLib object graph, and answers with exactly one terminal ServerFrame. QuantLib prices against the graph that is already built.</desc>

  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3ec99b"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78868c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1188" height="372" rx="16" fill="#11161a"/>

  <!-- browser -->
  <rect x="24" y="72" width="280" height="216" rx="12" fill="#1a2024" stroke="#2b3439" stroke-width="1"/>
  <text x="48" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#e9eef0">browser</text>
  <text x="48" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8b91">React · Redux · protobuf-es</text>
  <line x1="48" y1="144" x2="280" y2="144" stroke="#2b3439" stroke-width="1"/>
  <circle cx="52" cy="171" r="3" fill="#3ec99b"/>
  <text x="66" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">the workbook: market and trade</text>
  <circle cx="52" cy="205" r="3" fill="#3ec99b"/>
  <text x="66" y="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">the panels: sweeps, book, curves</text>
  <circle cx="52" cy="239" r="3" fill="#3ec99b"/>
  <text x="66" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">owns the document, not the graph</text>

  <!-- gap 1 -->
  <text x="379" y="120" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6f7d83">binary WebSocket</text>
  <text x="379" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#3ec99b">one ClientFrame</text>
  <line x1="312" y1="176" x2="446" y2="176" stroke="#3ec99b" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <line x1="446" y1="220" x2="312" y2="220" stroke="#78868c" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <text x="379" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8b91">one ServerFrame</text>

  <!-- service -->
  <rect x="454" y="72" width="280" height="216" rx="12" fill="#1a2024" stroke="#3ec99b" stroke-width="1.4"/>
  <text x="478" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#e9eef0">ql-backend</text>
  <text x="478" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8b91">C++ · one session per thread</text>
  <line x1="478" y1="144" x2="710" y2="144" stroke="#2b3439" stroke-width="1"/>
  <circle cx="482" cy="171" r="3" fill="#3ec99b"/>
  <text x="496" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">the session: a live object graph</text>
  <circle cx="482" cy="205" r="3" fill="#3ec99b"/>
  <text x="496" y="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">built once, held between requests</text>
  <circle cx="482" cy="239" r="3" fill="#3ec99b"/>
  <text x="496" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">a quote write moves the graph</text>

  <!-- gap 2 -->
  <text x="809" y="120" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6f7d83">in the same process</text>
  <text x="809" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#3ec99b">price this</text>
  <line x1="742" y1="176" x2="876" y2="176" stroke="#3ec99b" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <line x1="876" y1="220" x2="742" y2="220" stroke="#78868c" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <text x="809" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8b91">NPV and greeks</text>

  <!-- quantlib -->
  <rect x="884" y="72" width="280" height="216" rx="12" fill="#1a2024" stroke="#2b3439" stroke-width="1"/>
  <text x="908" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#e9eef0">QuantLib</text>
  <text x="908" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8b91">v1.43 · QL_ENABLE_SESSIONS</text>
  <line x1="908" y1="144" x2="1140" y2="144" stroke="#2b3439" stroke-width="1"/>
  <circle cx="912" cy="171" r="3" fill="#3ec99b"/>
  <text x="926" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">46 compiled engines</text>
  <circle cx="912" cy="205" r="3" fill="#3ec99b"/>
  <text x="926" y="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">curves, volatility, instruments</text>
  <circle cx="912" cy="239" r="3" fill="#3ec99b"/>
  <text x="926" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#c8d2d6">recomputes only what depends</text>

  <text x="594" y="330" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#8b979c">Moving a quote is one message and no rebuild, because the graph on the right of it is still standing.</text>
</svg>
